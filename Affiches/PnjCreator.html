<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PNJ Creator</title>
<style>
  :root {
    --bg1: #070a18;
    --bg2: #12093a;
    --cyan: #3de8ff;
    --violet: #a45bff;
    --pink: #ff4fb3;
    --text: #f2f4ff;
    --muted: #9aa3c7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; background: var(--bg1); overflow: hidden; }
  body { font-family: "Inter Display", "Inter", sans-serif; color: var(--text); }

  .poster {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background:
      radial-gradient(900px 700px at 50% 40%, rgba(164, 91, 255, .35), transparent 60%),
      radial-gradient(600px 500px at 15% 90%, rgba(61, 232, 255, .18), transparent 60%),
      radial-gradient(600px 500px at 90% 10%, rgba(255, 79, 179, .18), transparent 60%),
      linear-gradient(180deg, var(--bg1), var(--bg2) 55%, var(--bg1));
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(61, 232, 255, .07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(61, 232, 255, .07) 1px, transparent 1px);
    background-size: 54px 54px;
    mask-image: radial-gradient(ellipse at 50% 45%, #000 30%, transparent 75%);
  }
  .floor {
    position: absolute; left: -20%; right: -20%; bottom: 0; height: 420px;
    background-image:
      linear-gradient(rgba(164, 91, 255, .35) 2px, transparent 2px),
      linear-gradient(90deg, rgba(164, 91, 255, .35) 2px, transparent 2px);
    background-size: 80px 80px;
    transform: perspective(500px) rotateX(62deg);
    transform-origin: bottom;
    mask-image: linear-gradient(to top, #000, transparent 85%);
  }

  .top {
    position: absolute; top: 64px; left: 0; right: 0; text-align: center;
    font-size: 22px; letter-spacing: .5em; font-weight: 600; color: var(--muted);
  }
  .top b { color: var(--cyan); font-weight: 700; }

  .figure { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); }

  .title {
    position: absolute; top: 715px; left: 0; right: 0; text-align: center;
  }
  .title .pnj {
    font-size: 210px; font-weight: 900; line-height: .9; letter-spacing: .04em;
    background: linear-gradient(180deg, #ffffff 10%, var(--cyan) 55%, var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 30px rgba(61, 232, 255, .45));
  }
  .title .creator {
    margin-top: 8px;
    font-size: 92px; font-weight: 800; letter-spacing: .32em; padding-left: .32em;
    color: var(--text);
    text-shadow: 0 0 24px rgba(164, 91, 255, .9), 0 0 4px rgba(255,255,255,.6);
  }
  .tagline {
    margin-top: 26px; font-size: 30px; font-weight: 500; color: var(--muted); letter-spacing: .06em;
  }
  .tagline span { color: var(--pink); font-weight: 700; }

  .by {
    position: absolute; bottom: 70px; left: 0; right: 0; text-align: center;
  }
  .by .line {
    width: 420px; height: 2px; margin: 0 auto 26px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--violet), var(--pink), transparent);
  }
  .by .small { font-size: 24px; letter-spacing: .45em; color: var(--muted); font-weight: 600; }
  .by .name {
    margin-top: 10px; font-size: 64px; font-weight: 800; letter-spacing: .08em;
    background: linear-gradient(90deg, var(--cyan), var(--violet) 50%, var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .corner { position: absolute; width: 70px; height: 70px; border: 3px solid var(--cyan); opacity: .7; }
  .c1 { top: 36px; left: 36px; border-right: 0; border-bottom: 0; }
  .c2 { top: 36px; right: 36px; border-left: 0; border-bottom: 0; border-color: var(--pink); }
  .c3 { bottom: 36px; left: 36px; border-right: 0; border-top: 0; border-color: var(--pink); }
  .c4 { bottom: 36px; right: 36px; border-left: 0; border-top: 0; }
</style>
</head>
<body>
<div class="poster">
  <div class="grid"></div>
  <div class="floor"></div>
  <div class="corner c1"></div><div class="corner c2"></div>
  <div class="corner c3"></div><div class="corner c4"></div>

  <div class="top"><b>NOVA-LIFE</b> · AMBOISE</div>

  <svg class="figure" width="620" height="600" viewBox="0 0 620 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3de8ff"/>
        <stop offset="1" stop-color="#a45bff"/>
      </linearGradient>
      <radialGradient id="halo" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#a45bff" stop-opacity=".55"/>
        <stop offset="1" stop-color="#a45bff" stop-opacity="0"/>
      </radialGradient>
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="8" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <circle cx="310" cy="300" r="300" fill="url(#halo)"/>

    <!-- anneaux holographiques -->
    <circle cx="310" cy="290" r="250" fill="none" stroke="#3de8ff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 14"/>
    <circle cx="310" cy="290" r="215" fill="none" stroke="#ff4fb3" stroke-opacity=".35" stroke-width="2" stroke-dasharray="40 20"/>

    <!-- socle -->
    <ellipse cx="310" cy="560" rx="190" ry="26" fill="none" stroke="#3de8ff" stroke-width="3" filter="url(#glow)"/>
    <ellipse cx="310" cy="560" rx="120" ry="15" fill="#3de8ff" fill-opacity=".25"/>

    <!-- silhouette PNJ en wireframe -->
    <g fill="url(#body)" fill-opacity=".18" stroke="url(#body)" stroke-width="4" filter="url(#glow)">
      <circle cx="310" cy="150" r="70"/>
      <path d="M190 545 L200 330 Q205 250 310 245 Q415 250 420 330 L430 545 Z"/>
    </g>
    <g stroke="#3de8ff" stroke-opacity=".5" stroke-width="1.5" fill="none">
      <path d="M250 150 H370 M310 80 V220"/>
      <path d="M205 330 H415 M200 400 H420 M197 470 H423 M310 245 V545 M250 255 V545 M370 255 V545"/>
    </g>


    <!-- badge + (création) -->
    <g transform="translate(455 120)" filter="url(#glow)">
      <circle r="48" fill="#12093a" stroke="#ff4fb3" stroke-width="5"/>
      <path d="M-22 0 H22 M0 -22 V22" stroke="#ff4fb3" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- bulle de dialogue -->
    <g transform="translate(80 210)" filter="url(#glow)">
      <path d="M0 0 H120 Q135 0 135 15 V60 Q135 75 120 75 H55 L35 98 L38 75 H15 Q0 75 0 60 V15 Q0 0 15 0 Z"
            fill="#12093a" stroke="#3de8ff" stroke-width="4"/>
      <circle cx="40" cy="38" r="8" fill="#3de8ff"/>
      <circle cx="68" cy="38" r="8" fill="#3de8ff"/>
      <circle cx="96" cy="38" r="8" fill="#3de8ff"/>
    </g>
  </svg>

  <div class="title">
    <div class="pnj">PNJ</div>
    <div class="creator">CREATOR</div>
    <div class="tagline">Donnez vie à votre serveur <span>•</span> Créez vos propres PNJ</div>
  </div>

  <div class="by">
    <div class="line"></div>
    <div class="small">BY</div>
    <div class="name">LORIS STRANGE</div>
  </div>
</div>
</body>
</html>
